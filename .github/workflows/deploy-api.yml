# Push to main (apps/api) → rsync API to EC2 → migrate/build/PM2.
#
# GitHub → Settings → Secrets → Actions (repo: Codes-Thinker/lms)
# Required (same as Deploy Admin):
#   EC2_HOST, EC2_USER, EC2_SSH_KEY
# Optional:
#   EC2_APP_DIR   default ~/codesthinkerlms-server
#   EC2_PORT      default 3000
# Optional mirror of public server repo:
#   SERVER_REPO_TOKEN  PAT with push to Codes-Thinker/codesthinkerlms-server

name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

jobs:
  deploy-ec2:
    name: Rsync & restart on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LMS monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Require EC2 secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          missing=0
          [ -n "${EC2_HOST:-}" ] || { echo "::error::Missing secret EC2_HOST"; missing=1; }
          [ -n "${EC2_USER:-}" ] || { echo "::error::Missing secret EC2_USER"; missing=1; }
          [ -n "${EC2_SSH_KEY:-}" ] || { echo "::error::Missing secret EC2_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Install SSH key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync apps/api → EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          set -euo pipefail
          DIR="${APP_DIR:-/home/${EC2_USER}/codesthinkerlms-server}"
          # Expand ~ on remote if user passed ~/...
          REMOTE_DIR="$DIR"
          rsync -az --delete \
            -e "ssh -i $HOME/.ssh/ec2_key -o StrictHostKeyChecking=accept-new" \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude '.env.*' \
            --exclude .git \
            apps/api/ "${EC2_USER}@${EC2_HOST}:${REMOTE_DIR}/"
          # Ensure deploy script is executable on remote
          ssh -i "$HOME/.ssh/ec2_key" -o StrictHostKeyChecking=accept-new \
            "${EC2_USER}@${EC2_HOST}" \
            "mkdir -p '${REMOTE_DIR}/scripts' && chmod +x '${REMOTE_DIR}/scripts/deploy-ec2.sh' 2>/dev/null || true"

      - name: Migrate, build, PM2 restart
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          APP_PORT: ${{ secrets.EC2_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,APP_PORT
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            DIR="${APP_DIR:-$HOME/codesthinkerlms-server}"
            export PORT="${APP_PORT:-3000}"
            cd "$DIR"
            if [ -f scripts/deploy-ec2.sh ]; then
              bash scripts/deploy-ec2.sh
            else
              npm install
              npx prisma generate
              npx prisma migrate deploy
              npm run build
              pm2 restart codesthinkerlms --update-env || pm2 start dist/main.js --name codesthinkerlms --cwd "$DIR"
              pm2 save
            fi

  # Optional: keep codesthinkerlms-server GitHub mirror in sync (does not block deploy).
  sync-server-repo:
    name: Mirror to codesthinkerlms-server (optional)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout LMS monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone + push mirror
        env:
          TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::SERVER_REPO_TOKEN not set — skipping GitHub mirror (EC2 deploy still runs)."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/Codes-Thinker/codesthinkerlms-server.git" \
            server-repo
          rsync -a --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude '.env.*' \
            --exclude '.git' \
            apps/api/ server-repo/
          mkdir -p server-repo/scripts
          cp apps/api/scripts/deploy-ec2.sh server-repo/scripts/deploy-ec2.sh
          chmod +x server-repo/scripts/deploy-ec2.sh
          cd server-repo
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No API file changes to sync."
          else
            git commit -m "ci: sync API from lms@${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi
