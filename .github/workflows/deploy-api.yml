# Deploy API to EC2 — ONE job, same appleboy SSH as a real Admin deploy.
#
# REQUIRED secrets (repo Settings → Secrets → Actions):
#   EC2_HOST      e.g. 13.x.x.x or api.codesthinkerlms.site
#   EC2_USER      ubuntu
#   EC2_SSH_KEY   full private key including -----BEGIN...-----END-----
# OPTIONAL:
#   EC2_APP_DIR   default $HOME/codesthinkerlms-server
#   EC2_PORT      default 3000

name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

jobs:
  deploy-ec2:
    name: Pull & restart on EC2
    runs-on: ubuntu-latest
    steps:
      - name: Check EC2 secrets
        id: secrets
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          ok=1
          if [ -z "${EC2_HOST:-}" ]; then
            echo "::error title=Missing EC2_HOST::Add repo secret EC2_HOST (EC2 public IP or DNS)."
            ok=0
          fi
          if [ -z "${EC2_USER:-}" ]; then
            echo "::error title=Missing EC2_USER::Add repo secret EC2_USER (usually ubuntu)."
            ok=0
          fi
          if [ -z "${EC2_SSH_KEY:-}" ]; then
            echo "::error title=Missing EC2_SSH_KEY::Add repo secret EC2_SSH_KEY (PEM private key)."
            ok=0
          fi
          if [ "$ok" -ne 1 ]; then
            echo ""
            echo "============================================================"
            echo "Deploy API cannot run until these secrets exist on:"
            echo "  https://github.com/Codes-Thinker/lms/settings/secrets/actions"
            echo ""
            echo "  EC2_HOST     = your EC2 public IP"
            echo "  EC2_USER     = ubuntu"
            echo "  EC2_SSH_KEY  = private key that SSHs to that EC2"
            echo "  EC2_APP_DIR  = /home/ubuntu/codesthinkerlms-server  (optional)"
            echo ""
            echo "NOTE: Deploy Admin can show GREEN even when it SKIPS deploy"
            echo "(if EC2_ADMIN_DIR is empty). That does NOT mean API secrets exist."
            echo "============================================================"
            exit 1
          fi
          echo "Secrets OK — host=${EC2_USER}@${EC2_HOST}"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          APP_PORT: ${{ secrets.EC2_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,APP_PORT
          script_stop: true
          command_timeout: 20m
          script: |
            set -euo pipefail
            DIR="${APP_DIR:-$HOME/codesthinkerlms-server}"
            export PORT="${APP_PORT:-3000}"
            echo "==> API deploy dir: $DIR"
            if [ ! -d "$DIR" ]; then
              echo "Creating $DIR and cloning codesthinkerlms-server..."
              mkdir -p "$(dirname "$DIR")"
              git clone https://github.com/Codes-Thinker/codesthinkerlms-server.git "$DIR"
            fi
            cd "$DIR"
            if [ -d .git ]; then
              git fetch origin
              git checkout main
              git pull --ff-only origin main || git reset --hard origin/main
            fi
            if [ -f scripts/deploy-ec2.sh ]; then
              bash scripts/deploy-ec2.sh
            else
              npm install
              npx prisma generate
              npx prisma migrate deploy
              npm run build
              pm2 restart codesthinkerlms --update-env || pm2 start dist/main.js --name codesthinkerlms --cwd "$DIR"
              pm2 save
            fi
