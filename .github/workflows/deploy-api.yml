# Push to main (apps/api) → sync codesthinkerlms-server → SSH deploy EC2.
#
# GitHub → Settings → Secrets and variables → Actions (repo: Codes-Thinker/lms)
# Required:
#   SERVER_REPO_TOKEN  PAT with push to Codes-Thinker/codesthinkerlms-server
#   EC2_HOST           public IP / DNS
#   EC2_USER           ubuntu
#   EC2_SSH_KEY        private key (PEM) that can SSH to the instance
# Optional:
#   EC2_APP_DIR        default ~/codesthinkerlms-server
#   EC2_PORT           default 3000

name: Deploy API to EC2

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - ".github/workflows/deploy-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-api-ec2
  cancel-in-progress: false

jobs:
  sync-server-repo:
    name: Sync apps/api → codesthinkerlms-server
    runs-on: ubuntu-latest
    steps:
      - name: Checkout LMS monorepo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Clone server repo
        env:
          TOKEN: ${{ secrets.SERVER_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::error::Missing secret SERVER_REPO_TOKEN"
            exit 1
          fi
          git clone --depth 1 \
            "https://x-access-token:${TOKEN}@github.com/Codes-Thinker/codesthinkerlms-server.git" \
            server-repo

      - name: Mirror API into server repo
        run: |
          set -euo pipefail
          rsync -a --delete \
            --exclude node_modules \
            --exclude dist \
            --exclude .env \
            --exclude '.env.*' \
            --exclude '.git' \
            apps/api/ server-repo/
          mkdir -p server-repo/scripts
          cp apps/api/scripts/deploy-ec2.sh server-repo/scripts/deploy-ec2.sh
          chmod +x server-repo/scripts/deploy-ec2.sh

      - name: Commit and push server repo
        working-directory: server-repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No API file changes to sync."
          else
            git commit -m "ci: sync API from lms@${GITHUB_SHA::7}"
            git push origin HEAD:main
          fi

  deploy-ec2:
    name: Pull & restart on EC2
    needs: sync-server-repo
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.EC2_APP_DIR }}
          APP_PORT: ${{ secrets.EC2_PORT }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: APP_DIR,APP_PORT
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail
            DIR="${APP_DIR:-$HOME/codesthinkerlms-server}"
            export PORT="${APP_PORT:-3000}"
            cd "$DIR"
            if [ -f scripts/deploy-ec2.sh ]; then
              bash scripts/deploy-ec2.sh
            else
              git fetch origin && git checkout main && git pull --ff-only origin main
              npm install
              npx prisma generate
              npx prisma migrate deploy
              npm run build
              pm2 restart codesthinkerlms --update-env || pm2 start dist/main.js --name codesthinkerlms --cwd "$DIR"
              pm2 save
            fi
