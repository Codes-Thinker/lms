# Render Blueprint for Code's Thinker LMS API
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: codes-thinker-lms-api
    runtime: node
    rootDir: apps/api
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: PORT
        value: "4000"
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: APP_URL
        sync: false
      - key: API_URL
        sync: false
      # Comma-separated admin dashboard origins (required in production)
      - key: CORS_ORIGIN
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: "12h"
      - key: REFRESH_TOKEN_DAYS
        value: "14"
      - key: AI_API_KEY
        sync: false
      - key: AI_BASE_URL
        value: "https://api.openai.com/v1"
      - key: AI_MODEL
        value: "gpt-4o-mini"
      - key: AI_DAILY_LIMIT_PER_USER
        value: "40"

  # Keep auto-checkout reliable when the web dyno sleeps.
  - type: cron
    name: codes-thinker-auto-checkout
    runtime: node
    rootDir: apps/api
    plan: starter
    region: oregon
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: >-
      node -e "fetch(process.env.API_URL.replace(/\\/\$/,'')+'/ops/cron/auto-checkout',{method:'POST',headers:{Authorization:'Bearer '+(process.env.CRON_SECRET||'')}}).then(async r=>{const t=await r.text();console.log(r.status,t);if(!r.ok)process.exit(1)}).catch(e=>{console.error(e);process.exit(1)})"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: API_URL
        sync: false
      - key: CRON_SECRET
        sync: false
